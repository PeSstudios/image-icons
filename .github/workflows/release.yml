# Publishes a release for every pushed version tag (e.g. 1.2.0) with main.js, manifest.json and
# styles.css taken straight from the repository, and adds GitHub artifact attestations so anyone can
# verify the release files were made from this source (`gh attestation verify main.js -R PeSstudios/image-icons`).
# Run it by hand (Actions → Release → Run workflow) to attest and re-upload the files of an existing tag.
name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attest and (re)upload
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches manifest.json
        run: |
          version=$(jq -r .version manifest.json)
          [ "$version" = "$TAG" ] || { echo "manifest.json has $version, tag is $TAG"; exit 1; }

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --generate-notes
          fi
